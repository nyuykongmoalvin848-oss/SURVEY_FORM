<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>https://survey.form.freeCodeCamp.rocks</title>
    <link rel="stylesheet" href="Assets/styles/styles.css" />
  </head>
  <body>
    <div class="formbox">
      <header>
        <h1 id="title">freeCodeCamp survey form</h1>
        <p id="subtitle">
          <i>Thank you for taking time to help us improve the platform</i>
        </p>
      </header>
      <form>
        <label for="name">Name</label>


        <input type="text" id="name" placeholder="enter your name" />
        <br />
        <br />
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="enter your email" />
        <br />
        <br />
        <label for="age">Age(optional)</label>
        <input type="number" id="age" placeholder="enter your age" />
        <br />
        <br />
        <label for="role">  Which option best describes your current role</label>
        <select id="role">
          <option disabled>actual role in life</option>
          <option value="student">student</option>
          <option value="teacher">teacher</option>
          <option value="parent">parent</option>
        </select>
        <br />
        <br />
        <label for="definitely">Would you recommend freeCodeCamp to a friend.</label>
        <label>
          <br />
          <input
            type="radio"
            name="recommend"
            id="definitely"
            checked
          />definitely
        </label>
        <br/>
        <label for="maybe">
          <input type="radio" name="recommend" id="maybe" />Maybe
        </label>
        <br/>
        <label for="not-sure">
          <input type="radio" name="recommend" id="not-sure" />Not sure
        </label>
        <br/>
        <br/>
        <label for="feature"
          >What is your favorite feature of freeCodeCamp</label>
        <select id="feature">
          <option disabled>favorite feature</option>
          <option value="community">open community</option>
          <option value="challenges">challenges</option>
          <option value="Competition">Competition</option>
          <option value="projects">Project</option>
          <option value="Interaction">Interaction</option>
        </select>
        <br/>
        <br/>
        <label
          >What would you like to see improved (check all that apply)</label
        >
        <br/>
        <label> <input type="checkbox" />Front-end projects </label>
        <br/>
        <label> <input type="checkbox" />Back-end projects </label>
        <br/>
        <label> <input type="checkbox" />Data visualization </label>
        <br/>
        <label> <input type="checkbox" />challenges </label>
        <br/>
        <label> <input type="checkbox" />Open Source Community </label>
        <br/>
        <label> <input type="checkbox" />Gitter help rooms </label>
        <br/>
        <label> <input type="checkbox" />Videos </label>
        <br/>
        <label> <input type="checkbox" />City Meetups </label>
        <br/>
        <label> <input type="checkbox" />Wiki </label>
        <br/>
        <label> <input type="checkbox" />Forum </label>
        <br/>
        <label> <input type="checkbox" />Additional Courses </label>
        <br/>
        <br/>
        <label>Any Comments or suggestion</label>
        <textarea placeholder="Enter your Comments here..."></textarea>
        <br/>
        <br/>
        <button>Submit</button>
      </form>
    </div>
  </body>
</html>
